<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171717">
<title>Created Preset</title>
<link rel="stylesheet" href="/styles.css?v=star-edit-spacing-20261115">
</head>
<body class="created-presets-page">
<header class="site-header" aria-label="Site header"><div class="site-header-title">Created Presets</div></header>
<main class="detail-main">
<section class="detail-content" aria-labelledby="detail-title">
<a class="detail-back" href="/" id="preset-detail-back">← Back</a>
<h1 class="detail-heading" id="detail-title">Preset</h1>
<div class="detail-layout">
<div class="detail-image-wrap" id="detail-image-wrap">
<img class="detail-image" id="detail-image" alt="Preset media" hidden>
<video class="detail-image detail-video" id="detail-video" controls playsinline preload="metadata" hidden></video>
<p class="detail-image-empty" id="detail-image-empty">No image available</p>
<div class="detail-media-actions" id="detail-media-actions">
  <button type="button" id="detail-media-add" aria-label="Add media" title="Add media">+</button>
  <button type="button" id="detail-media-replace" hidden>Replace</button>
  <button type="button" id="detail-media-remove" class="danger" hidden>Remove</button>
  <input type="file" id="detail-media-input" accept="image/*,video/mp4" hidden>
</div>
<div class="preset-tags-panel" id="preset-tags-panel">
  <div class="preset-tags-list" id="preset-tags-list"></div>
  <div class="preset-tag-actions">
    <button type="button" class="preset-add-tag" id="preset-add-tag">+ Add Tag</button>
    <button type="button" class="preset-add-tag" id="preset-edit-tag">Edit Tag</button>
    <button type="button" class="preset-add-tag" id="preset-delete-tag">Delete Tag</button>
  </div>
  <div class="preset-tag-picker" id="preset-edit-picker" hidden>
    <label for="preset-edit-select">Choose a tag to edit</label>
    <select id="preset-edit-select"></select>
    <div><button type="button" id="preset-edit-cancel">Cancel</button><button type="button" id="preset-edit-continue">Edit Selected</button></div>
  </div>
  <div class="preset-tag-picker" id="preset-delete-picker" hidden>
    <label for="preset-delete-select">Choose a tag to delete</label>
    <select id="preset-delete-select"></select>
    <div><button type="button" id="preset-delete-cancel">Cancel</button><button type="button" id="preset-delete-confirm" class="danger">Delete Selected</button></div>
  </div>
  <form class="preset-tag-editor" id="preset-tag-editor" hidden>
    <label>Tag name<input id="preset-tag-name" type="text" maxlength="60" placeholder="Tag name" required></label>
    <label>Information<textarea id="preset-tag-info" rows="3" placeholder="Additional information" required></textarea></label>
    <div class="preset-tag-editor-actions"><button type="button" id="preset-tag-cancel">Cancel</button><button type="submit">Save Tag</button></div>
  </form>
</div>
</div>
<div class="detail-editor-wrap">
  <div class="detail-prompt-toolbar">
    <button type="button" id="preset-edit-menu-button" aria-haspopup="true" aria-expanded="false">Edit</button>
    <button type="button" class="preset-star-toggle" id="preset-star-toggle" aria-label="Star preset" aria-pressed="false" title="Star preset">☆</button>
    <div class="detail-edit-menu" id="preset-edit-menu" hidden>
      <button type="button" id="preset-edit-title">Edit Title</button>
      <button type="button" id="preset-delete-preset" class="danger">Delete Preset</button>
    </div>
  </div>
  <textarea class="detail-prompt" id="detail-prompt" aria-label="Preset prompt" placeholder="Prompt text will appear here…" spellcheck="false"></textarea>
</div>
</div>
<p class="detail-save-status" id="detail-save-status" role="status" aria-live="polite"></p>
</section>
</main>
<footer class="site-footer" aria-label="Site footer">
<a class="light-toggle is-on" href="/prompt-vault.html" aria-label="Switch to Prompt Vault" title="Switch to Prompt Vault"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-.8.6-1.2 1.4-1.4 2.5h-4.2c-.2-1.1-.6-1.9-1.4-2.5Z"/></svg></a>
</footer>
<script src="/created-preset-item.js?v=preset-stars-20261115" defer></script>
</body>
</html>
