<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171717"><title></title><link rel="stylesheet" href="/styles.css">
</head><body>
<header class="site-header" aria-label="Site header"></header>
<main class="site-main"><section class="gallery-grid" id="gallery" aria-label="Gallery">
<button class="gallery-tile add-button" id="add-item" type="button" aria-label="Add item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>
<div class="gallery-tile gallery-empty" aria-hidden="true"></div>

</section></main>
<footer class="site-footer" aria-label="Site footer">
<button class="import-button" id="import-button" type="button" aria-label="Import JSON" title="Import JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button>
</footer>
<input id="dataset-file" type="file" accept=".json,application/json" hidden>
<div class="import-backdrop" id="import-dialog" hidden><section class="import-dialog" role="dialog" aria-modal="true" aria-labelledby="import-title">
<header class="import-dialog-header"><div><h2 id="import-title">Import Dataset</h2><p>Prompt Vault-compatible dataset JSON</p></div><button class="dialog-close" id="dialog-close" type="button" aria-label="Close">×</button></header>
<div class="import-dialog-body">
<div class="import-dropzone" id="import-dropzone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M5 20h14"/></svg><strong>Select a dataset JSON file</strong><span>Choose a .json file exported from Datasets</span><button id="choose-file" class="dialog-action" type="button">Choose file</button></div>
<div id="import-error" class="import-error" role="alert" hidden></div>
<div id="import-preview" hidden><div class="import-stats"><div><span>Records found</span><strong id="record-count">0</strong></div><div><span>Images found</span><strong id="image-count">0</strong></div></div>
<div class="import-preview-list" id="preview-list"></div>
<div class="import-options"><label><input id="import-images" type="checkbox" checked> Import images</label><label><input id="import-prompts" type="checkbox" checked> Import prompts</label>
<div class="duplicate-options"><span>Duplicate handling</span><label><input type="radio" name="duplicates" value="skip" checked> Skip duplicates</label><label><input type="radio" name="duplicates" value="all"> Import all</label></div></div>
<div class="import-summary" id="import-summary" hidden></div>
<div class="import-actions"><button id="cancel-import" class="dialog-action secondary" type="button">Cancel</button><button id="confirm-import" class="dialog-action primary" type="button">Import dataset</button></div>
</div></div></section></div>
<script src="/app.js" defer></script></body></html>
